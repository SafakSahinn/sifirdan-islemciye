<svg width="950" height="400" viewBox="0 0 950 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- ================= ROW 1 ================= -->
  <!-- Faz 1 -->
  <rect x="20" y="20" width="280" height="140" rx="4" fill="#FFFFDE" stroke="#AAAA33" stroke-width="1.5"/>
  <text x="160" y="36" text-anchor="middle" font-size="12" fill="#333333">Faz 1 — Temeller</text>
  <rect x="40" y="65" width="110" height="60" rx="3" fill="#2ea44f" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="95" y="90" text-anchor="middle" font-size="12" fill="#ffffff">Bölüm 1</text>
  <text x="95" y="105" text-anchor="middle" font-size="12" fill="#ffffff">Sayı Sistemleri</text>
  <rect x="170" y="65" width="110" height="60" rx="3" fill="#d4a72c" stroke="#9a6700" stroke-width="1.5"/>
  <text x="225" y="84" text-anchor="middle" font-size="11" fill="#ffffff">Bölüm 2</text>
  <text x="225" y="98" text-anchor="middle" font-size="11" fill="#ffffff">Bool Cebri ve</text>
  <text x="225" y="112" text-anchor="middle" font-size="11" fill="#ffffff">Mantık Kapıları</text>

  <!-- Faz 2 -->
  <rect x="330" y="20" width="280" height="140" rx="4" fill="#FFFFDE" stroke="#AAAA33" stroke-width="1.5"/>
  <text x="470" y="36" text-anchor="middle" font-size="12" fill="#333333">Faz 2 — Kombinasyonel Mantık</text>
  <rect x="350" y="65" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="405" y="90" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 3</text>
  <text x="405" y="105" text-anchor="middle" font-size="12" fill="#24292f">K-map</text>
  <rect x="480" y="65" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="535" y="90" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 4</text>
  <text x="535" y="105" text-anchor="middle" font-size="12" fill="#24292f">Komb. Mantık</text>

  <!-- Faz 3 -->
  <rect x="640" y="20" width="280" height="140" rx="4" fill="#FFFFDE" stroke="#AAAA33" stroke-width="1.5"/>
  <text x="780" y="36" text-anchor="middle" font-size="12" fill="#333333">Faz 3 — Ardışık Mantık</text>
  <rect x="660" y="65" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="715" y="90" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 5</text>
  <text x="715" y="105" text-anchor="middle" font-size="12" fill="#24292f">Ardışık Mantık</text>
  <rect x="790" y="65" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="845" y="90" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 6</text>
  <text x="845" y="105" text-anchor="middle" font-size="12" fill="#24292f">Yazmaçlar</text>

  <!-- Row 1 içi oklar -->
  <line x1="150" y1="95" x2="168" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="95" x2="348" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="95" x2="478" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="95" x2="658" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="95" x2="788" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= ROW 2 ================= -->
  <!-- Faz 6 -->
  <rect x="20" y="240" width="280" height="140" rx="4" fill="#FFFFDE" stroke="#AAAA33" stroke-width="1.5"/>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#333333">Faz 6 — CPU</text>
  <rect x="105" y="285" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="160" y="310" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 9</text>
  <text x="160" y="325" text-anchor="middle" font-size="12" fill="#24292f">CPU Mimarisi</text>

  <!-- Faz 5 -->
  <rect x="330" y="240" width="280" height="140" rx="4" fill="#FFFFDE" stroke="#AAAA33" stroke-width="1.5"/>
  <text x="470" y="256" text-anchor="middle" font-size="12" fill="#333333">Faz 5 — RTL</text>
  <rect x="415" y="285" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="470" y="310" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 8</text>
  <text x="470" y="325" text-anchor="middle" font-size="12" fill="#24292f">RTL/ASMD</text>

  <!-- Faz 4 -->
  <rect x="640" y="240" width="280" height="140" rx="4" fill="#FFFFDE" stroke="#AAAA33" stroke-width="1.5"/>
  <text x="780" y="256" text-anchor="middle" font-size="12" fill="#333333">Faz 4 — Bellek</text>
  <rect x="725" y="285" width="110" height="60" rx="3" fill="#e1e4e8" stroke="#8c959f" stroke-width="1.5"/>
  <text x="780" y="310" text-anchor="middle" font-size="12" fill="#24292f">Bölüm 7</text>
  <text x="780" y="325" text-anchor="middle" font-size="12" fill="#24292f">Bellek</text>

  <!-- Row 2 içi oklar (sağdan sola) -->
  <line x1="725" y1="315" x2="527" y2="315" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="315" x2="217" y2="315" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Faz 3 -> Faz 4 bağlantı oku (aşağı inip sola dönüyor) -->
  <path d="M 845 125 C 845 210 900 240 900 275 C 900 300 850 300 838 300"
        fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= LEJANT ================= -->
  <rect x="20" y="392" width="0" height="0"/>
</svg>
